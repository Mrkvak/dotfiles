# Base
background=1a1b26
foreground=c0caf5

# Regular colors
regular0=15161e  # black
regular1=f7768e  # red
regular2=9ece6a  # green
regular3=e0af68  # yellow
regular4=5078b0  # blue - readable for ls directories, still reasonable for mc panels
regular5=bb9af7  # magenta
#regular6=7dcfff  # cyan - bright enough for mc menu text
regular6=56d4c4  # cyan - more green-teal, separates from blue
bright6=7ee8d8  # bright cyan
regular7=bbc5d6  # white with a touch of warmth
#regular7=a9b1d6  # white

# Bright colors
bright0=414868  # bright black (comments/dim text)
bright1=f7768e  # bright red
bright2=9ece6a  # bright green
bright3=e0af68  # bright yellow
